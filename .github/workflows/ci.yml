name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dollartl
          POSTGRES_USER: dollartl
          POSTGRES_PASSWORD: dollartl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dollartl -d dollartl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://dollartl:dollartl@localhost:5432/dollartl
      DATABASE_URL_SYNC: postgresql+psycopg://dollartl:dollartl@localhost:5432/dollartl
      POSTGRES_DSN: postgresql://dollartl:dollartl@localhost:5432/dollartl
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: alembic upgrade head
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t dollartl-api .
      - run: docker build -t dollartl-admin ./admin-web
