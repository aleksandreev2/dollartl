services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dollartl
      POSTGRES_USER: dollartl
      POSTGRES_PASSWORD: dollartl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dollartl -d dollartl"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["uvicorn", "dollartl.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "dollartl.worker.main"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-web:
    build:
      context: admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_ADMIN_DEVELOPMENT_ID: ${ADMIN_TELEGRAM_ID:-2096975784}
    ports:
      - "8080:80"

volumes:
  postgres-data:
  minio-data:
