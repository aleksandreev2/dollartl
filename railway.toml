[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'exec uvicorn dollartl.api.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
preDeployCommand = "python scripts/migrate_locked.py"
healthcheckPath = "/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
